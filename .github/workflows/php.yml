name: test

on: [push]

jobs:

  unit:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - php: 8.5
            illuminate: ^12.0
          - php: 8.4
            illuminate: ^12.0
          - php: 8.3
            illuminate: ^12.0
          - php: 8.2
            illuminate: ^12.0

    name: Unit - PHP ${{ matrix.php }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup PHP ${{ matrix.php }}
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php }}

    - name: Install dependencies
      run: composer require "illuminate/support:${{ matrix.illuminate }}" "illuminate/container:${{ matrix.illuminate }}" "illuminate/database:${{ matrix.illuminate }}" "illuminate/hashing:${{ matrix.illuminate }}" --no-interaction --no-progress --no-suggest

    - name: Run unit and feature tests
      run: composer run-script ci-test

    - uses: codecov/codecov-action@v5
      if: matrix.php == '8.5'

  integration:
    runs-on: ubuntu-latest

    services:
      dynamodb-local:
        image: amazon/dynamodb-local:latest
        ports:
          - 8000:8000

    name: Integration - PHP 8.5

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: 8.5

    - name: Install dependencies
      run: composer install --no-interaction --no-progress

    - name: Wait for DynamoDB Local
      run: |
        for i in $(seq 1 30); do
          if curl -s http://localhost:8000 > /dev/null 2>&1; then
            echo "DynamoDB Local is ready"
            break
          fi
          echo "Waiting for DynamoDB Local... ($i/30)"
          sleep 1
        done

    - name: Run integration tests
      env:
        DYNAMODB_LOCAL_ENDPOINT: http://localhost:8000
      run: vendor/bin/phpunit --testsuite Integration
